<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabs + favourites — mock</title>
<style>
:root, [data-theme="dark"] {
  --bg: #101318; --panel: #171c24; --panel2: #1f2631;
  --text: #e8ecf2; --muted: #9aa4b2; --border: #2a323e;
  --accent: #5b9dff; --accent-soft: rgba(91,157,255,.16);
}
[data-theme="light"] {
  --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5;
  --text: #1b2330; --muted: #5d6b7d; --border: #dde3ea;
  --accent: #2f6fe4; --accent-soft: rgba(47,111,228,.12);
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif;padding:0 0 92px}
.topbar{display:flex;justify-content:flex-end;padding:12px 16px 0}
.topbar button{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text)}
header{padding:10px 16px 4px}h1{font-size:24px;margin:0}.hsub{color:var(--muted);font-size:13px;margin:3px 0 0}
.view{display:none;padding:10px 16px;max-width:640px;margin:0 auto}.view.on{display:block}
input[type=search]{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chips button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:20px;padding:7px 12px;font-size:13px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.count{color:var(--muted);font-size:12.5px;margin:6px 0}
.ragacard{position:relative;display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 44px 13px 14px;margin:8px 0;color:var(--text);font:inherit}
.ragacard b{font-size:15.5px}.ragacard .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ragacard .scale{color:var(--accent);font-size:12.5px;margin-top:4px}
.star{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:none;font-size:20px;color:var(--muted)}
.star.fav{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13.5px;padding:8px;border-radius:9px}
.seg button.on{background:var(--panel);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chakra{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.chead{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:12px 13px;display:flex;align-items:center;gap:9px;font-size:14.5px;font:inherit}
.chead .num{color:var(--accent);font-weight:800;min-width:24px}.chead .nm{font-weight:700;flex:1}
.chead .sig{color:var(--muted);font-size:12px}.chead .arr{color:var(--muted)}
.chakra.open .chead .arr{transform:rotate(90deg);display:inline-block}
.cbody{display:none;padding:0 10px 10px}.chakra.open .cbody{display:block}
.cbody .ragacard{margin:6px 0}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font:inherit}
.tabbar button .ic{font-size:21px}.tabbar button.on{color:var(--accent);font-weight:700}
.mocktag{color:var(--accent);font-size:11px;border:1px solid var(--accent);border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:2px}
</style></head><body>
<div class="topbar"><button id="themeBtn" title="Toggle light/dark">◐ Theme</button></div>
<header><h1>RagaBrowser<span class="mocktag">mock</span></h1><p class="hsub">Tabbed: search · favourites · melakartas</p></header>

<section class="view" id="v-fav">

    b.onclick = () => { selS.has(s) ? selS.delete(s) : selS.add(s); renderSearch(); };
    c.appendChild(b);
  });
}
function renderSearch(){
  renderSw();
  const q = document.getElementById("q").value.trim().toLowerCase();
  const res = RAGAS.filter(r => {
    if (q && !r.name.toLowerCase().includes(q)) return false;
    if (selS.size){
      const ns = new Set([...r.aro, ...r.ava].map(s => s.replace("'","")));
      for (const s of selS) if (!ns.has(s)) return false;
    }
    return true;
  });
  document.getElementById("cnt").textContent = res.length + " of " + RAGAS.length;
  const d = document.getElementById("res"); d.innerHTML = "";
  res.forEach(r => d.appendChild(card(r)));
}
document.getElementById("q").oninput = renderSearch;
/* favourites */
function renderFav(){
  const list = [...favs].map(byId).filter(Boolean);
  document.getElementById("favcnt").textContent = list.length ? list.length + " favourite" + (list.length>1?"s":"") : "";
  const d = document.getElementById("favlist"); d.innerHTML = "";
  if (!list.length){ d.innerHTML = "<div class='empty'>No favourites yet.<br>Tap ☆ on any raga to pin it here.</div>"; return; }
  list.forEach(r => d.appendChild(card(r)));
}
/* melakarta chakra browse */
function renderCh(){
  const list = document.getElementById("chlist"); list.innerHTML = "";
  CHAKRAS.forEach((c, i) => {
    if (mFilter !== "all" && c.m !== mFilter) return;
    const d = document.createElement("div");
    d.className = "chakra" + (openCh === i ? " open" : "");
    const head = document.createElement("button");
    head.className = "chead";
    head.innerHTML = "<span class='num'>" + c.num + "</span><span class='nm'>" + c.name + "</span><span class='sig'>" + c.rg + " · " + c.m + "</span><span class='arr'>›</span>";
    head.onclick = () => { openCh = openCh === i ? -1 : i; renderCh(); };
    const body = document.createElement("div"); body.className = "cbody";
    c.ids.forEach(id => body.appendChild(card(byId(id))));
    d.appendChild(head); d.appendChild(body); list.appendChild(d);
  });
}
document.querySelectorAll("#mSeg button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#mSeg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); mFilter = b.dataset.m; openCh = -1; renderCh();
});
/* tabs */
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabbar button").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); document.getElementById(b.dataset.v).classList.add("on");
});
function renderAll(){ renderSearch(); renderFav(); renderCh(); }
renderAll();
</script><script>
(function(){var r=document.documentElement;
function set(t){r.setAttribute("data-theme",t);try{localStorage.setItem("ragamentor-theme",t)}catch(e){}}
var s=null;try{s=localStorage.getItem("ragamentor-theme")}catch(e){}
set(s||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
document.getElementById("themeBtn").onclick=function(){set(r.getAttribute("data-theme")==="light"?"dark":"light")};
})();
</script>
