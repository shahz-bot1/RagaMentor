<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chakra browse — mock</title>
<style>
:root{--bg:#f7f4ec;--panel:#fffdf7;--panel2:#efe9da;--text:#2b2620;--muted:#8a7f6a;--gold:#b8860b;--border:#ddd3bd;--chip:#f3eedd}
@media(prefers-color-scheme:dark){:root{--bg:#171410;--panel:#211d16;--panel2:#2b251b;--text:#ece5d3;--muted:#a89a7c;--gold:#d4a017;--border:#3d3423;--chip:#2e2718}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;padding:16px;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:14px;padding:9px;border-radius:9px}
.seg button.on{background:var(--panel);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chakra{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden}
.chead{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:13px 14px;display:flex;align-items:center;gap:10px;font-size:15px}
.chead .num{color:var(--gold);font-weight:800;min-width:26px}
.chead .nm{font-weight:700;flex:1}
.chead .sig{color:var(--muted);font-size:12.5px}
.chead .arr{color:var(--muted);transition:transform .2s}
.chakra.open .chead .arr{transform:rotate(90deg)}
.cbody{display:none;padding:2px 10px 12px}
.chakra.open .cbody{display:block}
.raga{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;margin:7px 0;font-size:14px}
.raga b{font-size:15px}.raga .rn{color:var(--gold);font-size:12px;margin-right:6px}
.raga .ar{color:var(--muted);font-size:12.5px;margin-top:3px}
.note{background:var(--panel2);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:14px}
</style></head><body>
<h1>Browse by chakra <span style="color:var(--gold);font-size:12px">· mock</span></h1>
<p class="sub">12 chakras × 6 melakartas. Tap a chakra to open it.</p>
<div class="seg" id="mSeg">
<button data-m="all" class="on">All 72</button><button data-m="M1">M1 · 1–36</button><button data-m="M2">M2 · 37–72</button>
</div>
<div id="list"></div>
<p class="note">Mock only — no audio, no search. Janya ragas (Mohanam etc.) stay in search; this view is melakartas only.</p>

", "S'"]}, {"n": 41, "name": "Pavani", "aro": ["S", "R1", "G1", "M2", "P", "D2", "N3", "S'"]}, {"n": 42, "name": "Raghupriya", "aro": ["S", "R1", "G1", "M2", "P", "D3", "N3", "S'"]}]}, {"name": "Vasu", "num": 8, "m": "M2", "rg": "R1 G2", "ragas": [{"n": 43, "name": "Gavambhodi", "aro": ["S", "R1", "G2", "M2", "P", "D1", "N1", "S'"]}, {"n": 44, "name": "Bhavapriya", "aro": ["S", "R1", "G2", "M2", "P", "D1", "N2", "S'"]}, {"n": 45, "name": "Shubhapantuvarali", "aro": ["S", "R1", "G2", "M2", "P", "D1", "N3", "S'"]}, {"n": 46, "name": "Shadvidhamargini", "aro": ["S", "R1", "G2", "M2", "P", "D2", "N2", "S'"]}, {"n": 47, "name": "Suvarnangi", "aro": ["S", "R1", "G2", "M2", "P", "D2", "N3", "S'"]}, {"n": 48, "name": "Divyamani", "aro": ["S", "R1", "G2", "M2", "P", "D3", "N3", "S'"]}]}, {"name": "Brahma", "num": 9, "m": "M2", "rg": "R1 G3", "ragas": [{"n": 49, "name": "Dhavalambari", "aro": ["S", "R1", "G3", "M2", "P", "D1", "N1", "S'"]}, {"n": 50, "name": "Namanarayani", "aro": ["S", "R1", "G3", "M2", "P", "D1", "N2", "S'"]}, {"n": 51, "name": "Kamavardhani", "aro": ["S", "R1", "G3", "M2", "P", "D1", "N3", "S'"]}, {"n": 52, "name": "Ramapriya", "aro": ["S", "R1", "G3", "M2", "P", "D2", "N2", "S'"]}, {"n": 53, "name": "Gamanashrama", "aro": ["S", "R1", "G3", "M2", "P", "D2", "N3", "S'"]}, {"n": 54, "name": "Vishwambari", "aro": ["S", "R1", "G3", "M2", "P", "D3", "N3", "S'"]}]}, {"name": "Disi", "num": 10, "m": "M2", "rg": "R2 G2", "ragas": [{"n": 55, "name": "Shyamalangi", "aro": ["S", "R2", "G2", "M2", "P", "D1", "N1", "S'"]}, {"n": 56, "name": "Shanmukhapriya", "aro": ["S", "R2", "G2", "M2", "P", "D1", "N2", "S'"]}, {"n": 57, "name": "Simhendramadhyamam", "aro": ["S", "R2", "G2", "M2", "P", "D1", "N3", "S'"]}, {"n": 58, "name": "Hemavati", "aro": ["S", "R2", "G2", "M2", "P", "D2", "N2", "S'"]}, {"n": 59, "name": "Dharmavati", "aro": ["S", "R2", "G2", "M2", "P", "D2", "N3", "S'"]}, {"n": 60, "name": "Neetimati", "aro": ["S", "R2", "G2", "M2", "P", "D3", "N3", "S'"]}]}, {"n let mFilter = "all", openChakra = -1;
function render(){
  const list = document.getElementById("list"); list.innerHTML = "";
  CHAKRAS.forEach((c, i) => {
    if (mFilter !== "all" && c.m !== mFilter) return;
    const d = document.createElement("div");
    d.className = "chakra" + (openChakra === i ? " open" : "");
    d.innerHTML = '<button class="chead"><span class="num">' + c.num + '</span>' +
      '<span class="nm">' + c.name + ' chakra</span>' +
      '<span class="sig">' + c.rg + ' · ' + c.m + '</span><span class="arr">›</span></button>' +
      '<div class="cbody">' + c.ragas.map(r =>
        '<button class="raga"><span class="rn">#' + r.n + '</span><b>' + r.name + '</b>' +
        '<div class="ar">' + r.aro.join(" ") + '</div></button>').join("") + '</div>';
    d.querySelector(".chead").onclick = () => { openChakra = openChakra === i ? -1 : i; render(); };
    list.appendChild(d);
  });
}
document.querySelectorAll("#mSeg button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#mSeg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); mFilter = b.dataset.m; openChakra = -1; render();
});
render();
</script></body></html>
