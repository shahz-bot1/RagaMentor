<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RagaMentor</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #101318; --panel: #171c24; --panel2: #1f2631;
    --text: #e8ecf2; --muted: #9aa4b2; --border: #2a323e;
    --accent: #5b9dff; --accent-soft: rgba(91,157,255,.16);
  }
  [data-theme="light"] {
    --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5;
    --text: #1b2330; --muted: #5d6b7d; --border: #dde3ea;
    --accent: #2f6fe4; --accent-soft: rgba(47,111,228,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Segoe UI, sans-serif;
         background: var(--bg); color: var(--text); }
  .topbar { display: flex; justify-content: flex-end; padding: 12px 20px; }
  .topbar button { font-size: 13px; padding: 6px 12px; border-radius: 8px;
                   border: 1px solid var(--border); background: transparent; color: var(--text); }
  .home { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  .home h1 { margin: 0; font-size: 34px; letter-spacing: .2px; }
  .home h1 span { color: var(--accent); }
  .tagline { margin: 6px 0 32px; color: var(--muted); font-size: 15px; }
  .appgrid { display: grid; gap: 14px; }
  .appcard { display: flex; align-items: center; gap: 16px; text-align: left;
             background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
             padding: 18px; cursor: pointer; width: 100%; color: var(--text); font: inherit; }
  .appcard:active { background: var(--panel2); }
  .appicon { flex: none; width: 52px; height: 52px; border-radius: 14px; font-size: 26px;
             display: flex; align-items: center; justify-content: center;
             background: var(--accent-soft); }
  .appmeta { flex: 1; min-width: 0; }
  .appmeta b { font-size: 17px; }
  .appmeta p { margin: 4px 0 6px; font-size: 13px; color: var(--muted); }
  .appmeta .stats { font-size: 12px; color: var(--accent); }
  .chev { color: var(--muted); font-size: 20px; }
  .coming { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="topbar"><button id="themeBtn" title="Toggle light/dark">◐ Theme</button></div>
<div class="home">
  <h1>Raga<span>Mentor</span></h1>
  <p class="tagline">Carnatic practice studio</p>
  <div class="appgrid">
    <button class="appcard" id="loopLabCard">
      <span class="appicon">🔁</span>
      <span class="appmeta">
        <b>LoopLab</b>
        <p>Slow down songs, loop phrases, practice.</p>
        <span class="stats" id="loopStats"></span>
      </span>
      <span class="chev">›</span>
    </button>
    <button class="appcard" id="talaCard">
      <span class="appicon">🥁</span>
      <span class="appmeta">
        <b>Tala Studio</b>
        <p>Keep time for your practice.</p>
      </span>
      <span class="chev">›</span>
    </button>
  </div>
  <p class="coming">More studios coming</p>
</div>
<script>
(function () {
  var root = document.documentElement;
  // theme: shared with LoopLab via the same localStorage key; fall back to system
  try {
    var saved = localStorage.getItem("slowloop-theme");
    if (saved) root.setAttribute("data-theme", saved);
    else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches)
      root.setAttribute("data-theme", "light");
    else root.setAttribute("data-theme", "dark");
  } catch (e) { root.setAttribute("data-theme", "dark"); }
  document.getElementById("themeBtn").onclick = function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("slowloop-theme", next); } catch (e) {}
  };
  document.getElementById("loopLabCard").onclick = function () { location.href = "prototype/"; };
  document.getElementById("talaCard").onclick = function () { location.href = "tala/"; };
  // live counts from the shared song library
  try {
    var req = indexedDB.open("slowloop-proto", 1);
    req.onsuccess = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("songs")) return;
      var tx = db.transaction("songs", "readonly");
      var all = tx.objectStore("songs").getAll();
      all.onsuccess = function () {
        var songs = all.result || [], loops = 0;
        songs.forEach(function (s) { loops += (s.loops || []).length; });
        document.getElementById("loopStats").textContent =
          songs.length + (songs.length === 1 ? " song" : " songs") + " · " +
          loops + (loops === 1 ? " loop" : " loops");
      };
    };
    req.onerror = function () {};
  } catch (e) {}
})();
</script>
</body>
</html>
